<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login - TCM Calendar</title>
    <link href="styles/fonts.css" rel="stylesheet">
    <link href="styles/base.css" rel="stylesheet">
    <link href="styles/header.css" rel="stylesheet">
    <link href="styles/auth.css" rel="stylesheet">
    <link href="styles/shared-components.css" rel="stylesheet">
    <link href="styles/responsive.css" rel="stylesheet">
    <link href="styles/consistency.css" rel="stylesheet">
</head>

<body class="auth-page">
<!-- Botó tornar enrere -->
<a class="back-button" href="tcm-calendar.html">
    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
         viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Tornar
</a>

<main class="auth-main">
    <div class="auth-container">
        <h2>INICIAR SESSIÓ</h2>
        <div class="info-box-warning">
            Si has creat el compte amb Google, se t'ha generat una contrasenya automàtica.
            Pots canviar-la amb l'opció de "Has oblidat la contrasenya?"
        </div>
        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" placeholder="el-teu-email@edu.tecnocampus.cat" required type="email">
            </div>
            <div class="form-group">
                <label for="password">Contrasenya</label>
                <div class="password-input-wrapper">
                    <input id="password" name="password" placeholder="••••••••••••••••" required type="password">
                    <button aria-label="Mostrar contrasenya" class="toggle-password" id="togglePassword"
                            type="button">
                        <!-- Ull obert - contrasenya oculta -->
                        <svg class="eye-icon" fill="none" stroke-linecap="round" stroke-linejoin="round"
                             viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <!-- Ull tancat - contrasenya visible -->
                        <svg class="eye-off-icon" fill="none" stroke-linecap="round" stroke-linejoin="round"
                             viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <line stroke-width="2.5" x1="1" x2="23" y1="1" y2="23"/>
                        </svg>
                    </button>
                </div>
                <div class="forgotten-password-link">
                    <a href="reset-password.html">Has oblidat la contrasenya?</a>
                </div>
            </div>
            <button class="auth-button" type="submit">INICIA SESSIÓ</button>
            <div class="error-message" id="errorMessage"></div>
        </form>

        <div class="auth-divider">
            <span>o bé</span>
        </div>

        <button class="google-button" id="googleLoginBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                      fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                      fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                      fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                      fill="#EA4335"/>
            </svg>
            Continuar amb Google
        </button>

        <p class="auth-link">
            No tens compte? <a href="register.html">Registra't</a>
        </p>
    </div>
</main>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>

<script src="scripts/utils.js"></script>
<script src="scripts/auth-state.js"></script>
<script src="scripts/header.js"></script>
<script src="scripts/login.js"></script>
</body>

</html>
