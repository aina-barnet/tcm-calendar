<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
  <style>
    .box{fill:#f8f9ff;stroke:#2b7cff;stroke-width:2;rx:8;}
    .decision{fill:#fff4e6;stroke:#ff9f1c;stroke-width:2;rx:8;}
    .text{font-family:Arial, Helvetica, sans-serif; font-size:14px; fill:#111}
    .title{font-weight:700; font-size:16px}
    .arrow{stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrowhead)}
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Main vertical flow -->
  <rect x="300" y="30" width="600" height="56" class="box" />
  <text x="600" y="64" text-anchor="middle" class="text title">Inici: petició generar horari</text>

  <line x1="600" y1="86" x2="600" y2="120" class="arrow" />

  <rect x="250" y="120" width="700" height="56" class="box" />
  <text x="600" y="155" text-anchor="middle" class="text">Normalitzar codis i carregar entrades</text>

  <line x1="600" y1="176" x2="600" y2="220" class="arrow" />

  <rect x="250" y="220" width="700" height="56" class="box" />
  <text x="600" y="255" text-anchor="middle" class="text">Construir alternatives per assignatura</text>

  <line x1="600" y1="276" x2="600" y2="330" class="arrow" />

  <!-- Decision: alternatives? -->
  <rect x="420" y="330" width="360" height="56" class="decision" />
  <text x="600" y="364" text-anchor="middle" class="text">Hi ha alternatives vàlides?</text>

  <!-- No branch -->
  <path d="M 480 386 L 260 480" class="arrow" />
  <rect x="120" y="480" width="260" height="56" class="box" />
  <text x="250" y="515" text-anchor="middle" class="text">No → Error / ResourceNotFound</text>

  <!-- Yes branch to calculate limit -->
  <path d="M 720 386 L 940 480" class="arrow" />
  <rect x="820" y="480" width="300" height="56" class="box" />
  <text x="970" y="515" text-anchor="middle" class="text">Sí → Calcular límit d'exploració</text>

  <path d="M 970 536 L 600 640" class="arrow" />

  <!-- Backtrack box (central) -->
  <rect x="180" y="640" width="840" height="420" rx="12" ry="12" fill="#ffffff" stroke="#2b7cff" stroke-width="2" />
  <text x="600" y="672" text-anchor="middle" class="text title">Backtrack (DFS recursiu)</text>

  <!-- Inside backtrack: steps arranged vertically -->
  <g>
    <rect x="220" y="700" width="720" height="48" class="box" />
    <text x="580" y="732" class="text">Per cada alternativa del subjecte a `depth`</text>

    <line x1="600" y1="748" x2="600" y2="788" class="arrow" />

    <rect x="320" y="788" width="560" height="48" class="box" />
    <text x="600" y="818" class="text">Calcular `ConflictStats` vs `selectedEntries`</text>

    <line x1="600" y1="836" x2="600" y2="880" class="arrow" />

    <rect x="260" y="880" width="680" height="48" class="box" />
    <text x="600" y="910" class="text">Afegir `selection` i `entries` a l'estat actual</text>

    <line x1="600" y1="928" x2="600" y2="972" class="arrow" />

    <rect x="340" y="972" width="520" height="48" class="decision" />
    <text x="600" y="1002" class="text">Si depth+1 == N → fulla</text>

    <line x1="600" y1="1028" x2="600" y2="1068" class="arrow" />

    <rect x="220" y="1068" width="720" height="48" class="box" />
    <text x="600" y="1098" class="text">Construir `TimetableOption`, puntuar i afegir a `result`</text>

    <line x1="600" y1="1116" x2="600" y2="1160" class="arrow" />

    <rect x="300" y="1160" width="600" height="48" class="box" />
    <text x="600" y="1190" class="text">Desfer (remove selection & entries) — continuar</text>

    <!-- Limit check arrow to top of backtrack (stop) -->
    <path d="M 840 1190 L 840 1280 L 400 1280" class="arrow" />
    <text x="770" y="1266" class="text">Si `exploredLeaves >= limit` → tallar</text>
  </g>

  </rect>

  <!-- After backtrack: results handling -->
  <line x1="600" y1="1060" x2="600" y2="1080" stroke-opacity="0" />
  <line x1="600" y1="1060" x2="600" y2="1100" class="arrow" />

  <rect x="250" y="1080" width="700" height="56" class="box" />
  <text x="600" y="1116" text-anchor="middle" class="text">Post-processar resultats</text>

  <line x1="600" y1="1138" x2="600" y2="1186" class="arrow" />

  <rect x="300" y="1186" width="600" height="56" class="box" />
  <text x="600" y="1222" text-anchor="middle" class="text">Ordenar per: conflicts, overlap, preference</text>

  <line x1="600" y1="1244" x2="600" y2="1286" class="arrow" />

  <rect x="350" y="1286" width="500" height="56" class="box" />
  <text x="600" y="1322" text-anchor="middle" class="text">Si hi ha opció sense conflictes → retornar success</text>

  <line x1="600" y1="1346" x2="600" y2="1380" class="arrow" />

  <rect x="350" y="1380" width="500" height="48" class="box" />
  <text x="600" y="1410" text-anchor="middle" class="text">Altrament → fallback `best-effort` i retornar amb error</text>

</svg>
<!-- Footer note: CSP remark for presentation -->
<g>
  <rect x="40" y="1426" width="1120" height="48" fill="#f7f7f9" stroke="#d0d7df" rx="6"/>
  <text x="600" y="1456" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif; font-size:12px; fill:#333;">Nota: No s'ha usat un solver CSP (p.ex. Choco/JaCoP). El generador és DFS/backtracking amb poda (límit fulles + branch-and-bound). Un solver CSP aportaria forward-checking, arc-consistency i heurístiques (MRV/LCV).</text>
</g>