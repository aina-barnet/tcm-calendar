<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <style>
    .box{fill:#fff;stroke:#2b7cff;stroke-width:2;rx:8}
    .prune{fill:#fff4e6;stroke:#ff9f1c;stroke-width:2;rx:8}
    .best{fill:#e6f9ec;stroke:#43a047;stroke-width:2;rx:8}
    .text{font-family:Arial, Helvetica, sans-serif; font-size:13px; fill:#111}
    .title{font-weight:700; font-size:16px}
    .arrow{stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrowhead)}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" class="text title">Poda Branch‑and‑Bound (Best‑Effort)</text>

  <!-- Root -->
  <rect x="440" y="60" width="120" height="44" class="box" />
  <text x="500" y="90" text-anchor="middle" class="text">Estat inicial</text>

  <!-- Level 1 options -->
  <rect x="160" y="160" width="160" height="44" class="box" />
  <text x="240" y="190" class="text">A1 (conflicts=0)</text>
  <rect x="420" y="160" width="160" height="44" class="box" />
  <text x="500" y="190" class="text">A2 (conflicts=1)</text>
  <rect x="680" y="160" width="160" height="44" class="box" />
  <text x="760" y="190" class="text">A3 (conflicts=2)</text>

  <line x1="500" y1="104" x2="240" y2="160" class="arrow" />
  <line x1="500" y1="104" x2="500" y2="160" class="arrow" />
  <line x1="500" y1="104" x2="760" y2="160" class="arrow" />

  <!-- Level 2 under A1 (good branch) -->
  <rect x="120" y="260" width="160" height="44" class="best" />
  <text x="200" y="290" class="text">B1 (conflicts=0)</text>
  <rect x="300" y="260" width="160" height="44" class="box" />
  <text x="380" y="290" class="text">B2 (conflicts=1)</text>

  <line x1="240" y1="204" x2="200" y2="260" class="arrow" />
  <line x1="240" y1="204" x2="380" y2="260" class="arrow" />

  <!-- Level 2 under A2 (worse branch) -->
  <rect x="420" y="260" width="160" height="44" class="prune" />
  <text x="500" y="290" class="text">B3 (conflicts=3) — Podat</text>
  <rect x="620" y="260" width="160" height="44" class="box" />
  <text x="700" y="290" class="text">B4 (conflicts=2)</text>

  <line x1="500" y1="204" x2="500" y2="260" class="arrow" />
  <line x1="500" y1="204" x2="700" y2="260" class="arrow" />

  <!-- Explanation panel -->
  <rect x="40" y="340" width="920" height="150" fill="#f7f7f9" stroke="#d0d7df" rx="8"/>
  <text x="60" y="370" class="text" style="font-weight:700">Com funciona la poda Branch‑and‑Bound</text>
  <text x="60" y="392" class="text">- Manté la millor solució trobada (menys conflictes / menys overlap).</text>
  <text x="60" y="412" class="text">- Abans d'explorar una branca, compara l'estat parcial (conflicts + overlap) amb la millor solució.</text>
  <text x="60" y="432" class="text">- Si l'estat ja és pitjor o igual que la millor solució, poda la branca (no cal explorar-la).</text>
  <text x="60" y="452" class="text">- Això redueix l'espai de cerca sense fer forward‑checking; és una poda heurística.</text>

</svg>
<!-- Footer note: CSP remark for presentation -->
<g>
  <rect x="40" y="480" width="920" height="36" fill="#fffaf0" stroke="#f0e6d8" rx="6"/>
  <text x="500" y="505" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif; font-size:12px; fill:#333;">Nota: No es fa servir un solver CSP. El mètode és backtracking amb poda; un solver CSP podria aplicar propagació de restriccions i heurístiques per millorar la poda anticipada.</text>
</g>