<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <style>
    .box{fill:#fff;stroke:#2b7cff;stroke-width:2;rx:8}
    .text{font-family:Arial, Helvetica, sans-serif; font-size:13px; fill:#111}
    .title{font-weight:700; font-size:16px}
  </style>

  <text x="500" y="30" text-anchor="middle" class="text title">DFS/backtracking (actual) vs Solver CSP (teòric)</text>

  <!-- DFS column -->
  <rect x="40" y="80" width="420" height="300" class="box" />
  <text x="250" y="110" class="text" style="font-weight:700">DFS / Backtracking</text>
  <text x="60" y="140" class="text">- Variable = cada assignatura</text>
  <text x="60" y="160" class="text">- Domini = alternatives (grups teoria/pràctiques)</text>
  <text x="60" y="180" class="text">- Comprovació incremental: pairwise conflicts</text>
  <text x="60" y="200" class="text">- Poda: límit fulles + branch‑and‑bound</text>
  <text x="60" y="220" class="text">- No forward‑checking / no arc‑consistency</text>

  <!-- CSP column -->
  <rect x="540" y="80" width="420" height="300" class="box" />
  <text x="760" y="110" class="text" style="font-weight:700">Solver CSP (exemple)</text>
  <text x="560" y="140" class="text">- Variables i dominis iguals però amb Estructura</text>
  <text x="560" y="160" class="text">- Forward‑checking: eliminar valors impossibles abans d'explorar</text>
  <text x="560" y="180" class="text">- Arc‑consistency (AC‑3/MAC): propagar restriccions</text>
  <text x="560" y="200" class="text">- Heurístiques: MRV, LCV, ordre d'assignació</text>
  <text x="560" y="220" class="text">- Pot trobar solucions més ràpid mitjançant poda anticipada</text>

  <!-- Middle comparison arrows -->
  <text x="500" y="270" class="text" text-anchor="middle">Millores possibles si adaptes algunes tècniques CSP al generator</text>
  <text x="500" y="290" class="text" text-anchor="middle">- aplicar forward‑checking per reduir dominis</text>
  <text x="500" y="310" class="text" text-anchor="middle">- usar MRV per ordenar variables (assignatures amb menys alternatives primer)</text>

</svg>
<!-- Footer note: CSP remark for presentation -->
<g>
  <rect x="40" y="330" width="920" height="64" fill="#f7f7f9" stroke="#d0d7df" rx="8"/>
  <text x="500" y="354" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif; font-size:12px; fill:#333; font-weight:700">Nota per a la diapositiva:</text>
  <text x="500" y="374" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif; font-size:11px; fill:#333;">No s'ha usat un solver CSP (p.ex. Choco/JaCoP). El generador actual és DFS/backtracking amb poda; un solver CSP afegiria forward‑checking, arc‑consistency i heurístiques (MRV/LCV).</text>
</g>