<?xml version="1.0" encoding="UTF-8"?>
<svg width="140" height="140" viewBox="0 0 140 140" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle -->
    <circle cx="70" cy="70" r="70" fill="#f5f5f5"/>
    
    <!-- Head -->
    <circle cx="70" cy="60" r="25" fill="#DFA023"/>
    
    <!-- Body -->
    <path d="M70 90c-20 0-37.5 12.5-45 30h90c-7.5-17.5-25-30-45-30z" fill="#DFA023"/>
    
    <!-- Optional decorative elements -->
    <circle cx="70" cy="70" r="68" fill="none" stroke="#DFA023" stroke-width="2"/>
    
    <!-- Shadow effect -->
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
</svg>