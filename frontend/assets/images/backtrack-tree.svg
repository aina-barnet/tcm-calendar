<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <style>
    .node{fill:#fff;stroke:#2b7cff;stroke-width:2;rx:6}
    .text{font-family:Arial, Helvetica, sans-serif; font-size:13px; fill:#111}
    .title{font-weight:700; font-size:16px}
    .arrow{stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrowhead)}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" class="text title">Arbre d'exploració (Backtracking DFS)</text>

  <!-- Level 0 -->
  <rect x="440" y="60" width="120" height="36" class="node" />
  <text x="500" y="86" text-anchor="middle" class="text">Subjecte 1</text>

  <!-- Level 1 nodes -->
  <rect x="180" y="160" width="140" height="36" class="node" />
  <text x="250" y="186" class="text">Alt 1.1</text>
  <rect x="430" y="160" width="140" height="36" class="node" />
  <text x="500" y="186" class="text">Alt 1.2</text>
  <rect x="680" y="160" width="140" height="36" class="node" />
  <text x="750" y="186" class="text">Alt 1.3</text>

  <line x1="500" y1="96" x2="250" y2="160" class="arrow" />
  <line x1="500" y1="96" x2="500" y2="160" class="arrow" />
  <line x1="500" y1="96" x2="750" y2="160" class="arrow" />

  <!-- Level 2 nodes under Alt 1.1 -->
  <rect x="120" y="260" width="120" height="36" class="node" />
  <text x="180" y="286" class="text">Alt 2.1</text>
  <rect x="280" y="260" width="120" height="36" class="node" />
  <text x="340" y="286" class="text">Alt 2.2</text>

  <line x1="250" y1="196" x2="180" y2="260" class="arrow" />
  <line x1="250" y1="196" x2="340" y2="260" class="arrow" />

  <!-- Level 2 nodes under Alt 1.2 -->
  <rect x="420" y="260" width="120" height="36" class="node" />
  <text x="480" y="286" class="text">Alt 2.3</text>
  <rect x="580" y="260" width="120" height="36" class="node" />
  <text x="640" y="286" class="text">Alt 2.4</text>

  <line x1="500" y1="196" x2="480" y2="260" class="arrow" />
  <line x1="500" y1="196" x2="640" y2="260" class="arrow" />

  <!-- Level 2 nodes under Alt 1.3 -->
  <rect x="720" y="260" width="120" height="36" class="node" />
  <text x="780" y="286" class="text">Alt 2.5</text>

  <line x1="750" y1="196" x2="780" y2="260" class="arrow" />

  <!-- Example backtrack arrows -->
  <path d="M 400 300 C 350 380, 300 420, 180 460" stroke="#ff4d4f" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <text x="320" y="370" class="text" fill="#ff4d4f">Backtrack (tornar i provar següent alternativa)</text>

  <!-- Leaf example -->
  <rect x="120" y="360" width="120" height="36" fill="#e6f9ec" stroke="#43a047" stroke-width="2" rx="6"/>
  <text x="180" y="386" class="text">Fulla: combinació vàlida</text>

  <text x="500" y="540" text-anchor="middle" class="text">Cada camí = una combinació (una alternativa per subjecte) — el DFS prova totes fins arribar a límits o trobar bones solucions.</text>
</svg>
<!-- Footer note: CSP remark for presentation -->
<g>
  <rect x="20" y="556" width="960" height="36" fill="#f7f7f9" stroke="#d0d7df" rx="6"/>
  <text x="500" y="580" text-anchor="middle" style="font-family:Arial, Helvetica, sans-serif; font-size:12px; fill:#333;">Nota: No s'ha usat un solver CSP. El generador prové d'un DFS/backtracking amb poda; un solver CSP afegiria propagació de restriccions (forward-checking, AC) i heurístiques (MRV/LCV).</text>
</g>