<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Recupera la contrasenya - TCM Calendar</title>
    <link href="styles/fonts.css" rel="stylesheet">
    <link href="styles/base.css" rel="stylesheet">
    <link href="styles/auth.css" rel="stylesheet">
    <link href="styles/shared-components.css" rel="stylesheet">
    <link href="styles/responsive.css" rel="stylesheet">
    <link href="styles/consistency.css" rel="stylesheet">
</head>

<body class="auth-page">
<a class="back-button" href="tcm-calendar.html">
    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
         viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Tornar
</a>

<main class="auth-main">
    <div class="auth-container">
        <h2>RECUPERAR CONTRASENYA</h2>
        <div class="info-box-neutral-sm">
            Introdueix el teu correu electrònic per rebre un enllaç i restablir la contrasenya.
        </div>
        <form class="auth-form" id="resetForm">
            <div class="form-group">
                <label for="resetEmail">Email</label>
                <input id="resetEmail" name="resetEmail" placeholder="el-teu-email@edu.tecnocampus.cat" required
                       type="email">
            </div>
            <button class="auth-button" type="submit">ENVIAR ENLLAÇ</button>
            <div class="error-message" id="resetMessage"></div>
        </form>
    </div>
</main>
<script src="scripts/reset-password.js"></script>
</body>

</html>
