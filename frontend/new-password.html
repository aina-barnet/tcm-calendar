<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Nova contrasenya - TCM Calendar</title>
    <link href="styles/fonts.css" rel="stylesheet">
    <link href="styles/base.css" rel="stylesheet">
    <link href="styles/auth.css" rel="stylesheet">
    <link href="styles/shared-components.css" rel="stylesheet">
    <link href="styles/responsive.css" rel="stylesheet">
    <link href="styles/consistency.css" rel="stylesheet">
</head>

<body class="auth-page">
    <a class="back-button" href="tcm-calendar.html">
        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Tornar
    </a>

    <main class="auth-main">
        <div class="auth-container">
            <h2>NOVA CONTRASENYA</h2>
            <form class="auth-form" id="newPasswordForm">
                <input id="email" name="email" type="hidden">
                <input id="token" name="token" type="hidden">
                <div class="form-group">
                    <label for="password">Nova contrasenya</label>
                    <input id="password" name="password" placeholder="••••••••••••••••" required type="password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Repeteix la contrasenya</label>
                    <input id="confirmPassword" name="confirmPassword" placeholder="••••••••••••••••" required
                        type="password">
                </div>
                <button class="auth-button" type="submit">CANVIA CONTRASENYA</button>
                <div class="error-message" id="newPasswordMessage"></div>
            </form>
        </div>
    </main>
    <script src="scripts/utils.js"></script>
    <script src="scripts/new-password.js"></script>
</body>

</html>
